services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fanshuye
      POSTGRES_USER: fanshuye
      POSTGRES_PASSWORD: fanshuye
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fanshuye -d fanshuye']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - fanshuye-postgres:/var/lib/postgresql/data

volumes:
  fanshuye-postgres:
