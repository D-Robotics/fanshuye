name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fanshuye_test
          POSTGRES_USER: fanshuye
          POSTGRES_PASSWORD: fanshuye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fanshuye -d fanshuye_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://fanshuye:fanshuye@127.0.0.1:5432/fanshuye_test
      TEST_DATABASE_URL: postgres://fanshuye:fanshuye@127.0.0.1:5432/fanshuye_test
      SESSION_SECRET: test-session-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm check

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fanshuye/desktop typecheck
      - run: pnpm --filter @fanshuye/desktop build
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm --filter @fanshuye/desktop build:native
